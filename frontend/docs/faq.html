<h1>常见问题 FAQ</h1>
<h2>Q: 提示找不到 Java？</h2>
<p>A: 点击「Java 管理」->「安装 Java」自动下载。</p>
<h2>Q: 游戏启动失败？</h2>
<p>A: 检查崩溃报告，确认 Java 版本正确（建议 Java 17+）。</p>
<h2>Q: 模组不兼容？</h2>
<p>A: 确认模组支持的 Minecraft 版本与已安装版本匹配。</p>
