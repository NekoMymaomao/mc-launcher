<!DOCTYPE html>

<h1>MC Launcher 使用教程</h1>
<h2>快速开始</h2>
<ol>
<li>下载对应平台的启动器</li>
<li>首次运行会自动创建配置目录</li>
<li>安装所需的 Minecraft 版本</li>
<li>启动游戏</li>
</ol>
<h2>功能说明</h2>
<ul>
<li><strong>版本管理</strong>: 安装/删除/验证游戏版本</li>
<li><strong>账号系统</strong>: 支持离线、Microsoft、Authlib 登录</li>
<li><strong>Java 管理</strong>: 自动检测或下载 Java 17+</li>
<li><strong>Modrinth</strong>: 搜索和安装模组/光影/资源包</li>
<li><strong>服务器</strong>: 管理多人游戏服务器</li>
</ul>
<h2>API 使用</h2>
<pre>curl http://localhost:9876/api/versions</pre>
</body>
</html>
