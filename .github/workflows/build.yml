name: Build MC Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: tar.gz
          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            ext: tar.gz
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: zip
          - os: macos-13
            goos: darwin
            goarch: amd64
            ext: tar.gz
          - os: macos-14
            goos: darwin
            goarch: arm64
            ext: tar.gz
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build
      run: |
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o mc_launcher .
    - name: Package
      run: |
        mkdir -p dist/launcher
        cp mc_launcher dist/
        mkdir -p dist/launcher
        (cd dist && tar czf ../mc-launcher-${{ matrix.goos }}-${{ matrix.goarch }}.${{ matrix.ext }} .)
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-${{ matrix.goos }}-${{ matrix.goarch }}
        path: mc-launcher-*.tar.gz
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
