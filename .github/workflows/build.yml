name: Build MC Launcher

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  BUILD_TYPE: Release
  CACHE_NAME: mc-launcher-deps

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4

    # ============================================================
    # Linux: 自动安装依赖
    # ============================================================
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libcurl4-openssl-dev \
          nlohmann-json3-dev

    # ============================================================
    # Windows: 提示用户手动安装依赖
    # ============================================================
    - name: Setup Windows dependencies
      if: runner.os == 'Windows'
      run: |
        echo "=========================================="
        echo "Windows Build Dependencies"
        echo "=========================================="
        echo ""
        echo "For local builds, install these dependencies:"
        echo ""
        echo "1. CMake: https://cmake.org/download/"
        echo "2. Visual Studio 2019+ with C++ tools"
        echo "3. vcpkg (recommended):"
        echo "   git clone https://github.com/microsoft/vcpkg"
        echo "   .\vcpkg\bootstrap-vcpkg.bat"
        echo "   .\vcpkg\vcpkg install curl boost filesystem"
        echo ""
        echo "=========================================="
        
        # 检查是否已安装
        if (cmd /c "cmake --version" 2>$null) {
            cmake --version
        } else {
            Write-Host "WARNING: cmake not found"
        }

    # ============================================================
    # CMake 配置
    # ============================================================
    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
          -DBUILD_TESTS=ON

    # ============================================================
    # 构建
    # ============================================================
    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build \
          --config ${{ env.BUILD_TYPE }} \
          --parallel

    # ============================================================
    # 测试
    # ============================================================
    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure

    # ============================================================
    # 打包产物
    # ============================================================
    - name: Package
      run: |
        cmake --install ${{ github.workspace }}/build \
          --config ${{ env.BUILD_TYPE }}
        
        # 创建发布包
        $package_name = if ($env:RUNNER_OS -eq 'Windows') { 'mc-launcher-windows' } else { 'mc-launcher-linux' }
        
        if ($env:RUNNER_OS -eq 'Windows') {
            Compress-Archive -Path "${{ github.workspace }}/install/*" -DestinationPath "${{ github.workspace }}/$package_name.zip"
        } else {
            cd ${{ github.workspace }}/install
            tar czf ${{ github.workspace }}/$package_name.tar.gz .
        }
        
        Write-Host "Package created: ${{ github.workspace }}/$package_name.*"

    # ============================================================
    # 上传产物
    # ============================================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-${{ runner.os }}
        path: ${{ github.workspace }}/mc-launcher-${{ runner.os }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Upload to release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
