name: Build MC Launcher CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-arm64
          - linux-amd64
          - windows-amd64

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: tar.gz
            name: mc-launcher-linux-amd64
          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            ext: tar.gz
            name: mc-launcher-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: zip
            name: mc-launcher-windows-amd64.exe
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build CLI
      run: go build -ldflags="-s -w" -o ${{ matrix.name }} .
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
    - name: Package Linux/macOS
      if: matrix.ext != 'zip'
      run: |
        mkdir -p dist
        cp ${{ matrix.name }} dist/
        (cd dist && tar czf ../${{ matrix.name }}.${{ matrix.ext }} .)
    - name: Package Windows
      if: matrix.ext == 'zip'
      run: |
        mkdir -p dist
        cp ${{ matrix.name }} dist/
        Compress-Archive -Path dist/* -DestinationPath ${{ matrix.name }}.${{ matrix.ext }} -Force
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.name }}.${{ matrix.ext }}
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create Draft Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: true
        prerelease: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
