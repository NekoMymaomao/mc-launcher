name: Build MC Launcher

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  BUILD_TYPE: Release
  CACHE_KEY: mc-launcher-deps

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    steps:
    - uses: actions/checkout@v4

    # ============================================================
    # Linux: 安装依赖
    # ============================================================
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libcurl4-openssl-dev \
          libssl-dev \
          zlib1g-dev

    # ============================================================
    # Windows: 环境准备
    # ============================================================
    - name: Setup Windows
      if: runner.os == 'Windows'
      uses: lukka/run-cmake@v3
      with:
        cmakeCommandArgs: -DCMAKE_BUILD_TYPE=Release

    # ============================================================
    # 构建
    # ============================================================
    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DBUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build \
          --config ${{ env.BUILD_TYPE }} \
          --parallel

    # ============================================================
    # 测试
    # ============================================================
    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure

    # ============================================================
    # 打包
    # ============================================================
    - name: Package
      run: |
        cmake --install ${{ github.workspace }}/build \
          --config ${{ env.BUILD_TYPE }} \
          --prefix ${{ github.workspace }}/install
        
        # 创建启动器目录结构
        mkdir -p ${{ github.workspace }}/install/launcher/{versions,libraries,assets,sessions,backups,logs}
        
        # 复制配置文件
        cp -r config/launcher_template/* ${{ github.workspace }}/install/launcher/ 2>/dev/null || true
        
        # 打包
        if [ "${{ runner.os }}" == "Windows" ]; then
            cd ${{ github.workspace }}/install
            7z a -tzip mc-launcher-windows.zip .
        else
            cd ${{ github.workspace }}/install
            tar czf mc-launcher-linux.tar.gz .
        fi

    # ============================================================
    # 上传 artifacts
    # ============================================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-${{ runner.os }}
        path: ${{ github.workspace }}/mc-launcher-${{ runner.os }}.*
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: Upload to release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
