name: Build and Release MC Launcher

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  BUILD_TYPE: Release
  CACHE_NAME: mc-launcher-deps

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    steps:
    - uses: actions/checkout@v4

    # ============================================================
    # 安装依赖
    # ============================================================
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          build-essential \
          libcurl4-openssl-dev \
          zlib1g-dev \
          nlohmann-json3-dev

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: |
        vcpkg integrate install
        vcpkg install curl:x64-windows zlib:x64-windows nlohmann-json:x64-windows

    # ============================================================
    # CMake 配置
    # ============================================================
    - name: Configure CMake
      run: |
        cmake -B ${{ github.workspace }}/build \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
          -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
          -DBUILD_TESTS=ON

    # ============================================================
    # 构建
    # ============================================================
    - name: Build
      run: |
        cmake --build ${{ github.workspace }}/build \
          --config ${{ env.BUILD_TYPE }} \
          --parallel

    # ============================================================
    # 测试
    # ============================================================
    - name: Run tests
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure

    # ============================================================
    # 打包产物
    # ============================================================
    - name: Package
      run: |
        cmake --install ${{ github.workspace }}/build \
          --config ${{ env.BUILD_TYPE }}
        
        # 创建发布包
        $package_name = "mc-launcher-${{ runner.os }}-x64"
        
        if ($env:RUNNER_OS -eq 'Windows') {
            Compress-Archive -Path "${{ github.workspace }}/install/*" -DestinationPath "${{ github.workspace }}/$package_name.zip"
        } else {
            cd ${{ github.workspace }}/install
            tar czf ${{ github.workspace }}/$package_name.tar.gz .
        }
        
        echo "PACKAGE_NAME=$package_name" >> $GITHUB_ENV

    # ============================================================
    # 上传工件
    # ============================================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.PACKAGE_NAME }}
        path: ${{ github.workspace }}/${{ env.PACKAGE_NAME }}.*
        retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-draft:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create Draft Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: true
        prerelease: true
        name: "Nightly Build ${{ github.sha }}"
        tag_name: "nightly-${{ github.sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
