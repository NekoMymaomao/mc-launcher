name: Build MC Launcher

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libcurl4-openssl-dev

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install curl:x64-windows

    - name: Configure (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Test
      run: ctest --test-dir build -C Release --output-on-failure

    - name: Package
      shell: bash
      run: |
        set -e
        cmake --install build --config Release --prefix install
        mkdir -p dist
        if [ "${{ runner.os }}" = "Windows" ]; then
          (cd install && 7z a -tzip ../dist/mc-launcher-windows-x64.zip .)
        else
          tar czf dist/mc-launcher-linux-x64.tar.gz -C install .
        fi
        ls -la dist

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-${{ runner.os }}-x64
        path: dist/*
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Publish release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
