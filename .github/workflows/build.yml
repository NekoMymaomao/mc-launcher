name: Build MC Launcher WebUI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Build
      run: |
        cd Core/mc-launcher
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-linux-amd64 .
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mc-launcher-linux-arm64 .
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-windows-amd64.exe .
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: core-dist
        path: Core/mc-launcher/mc-launcher-*
        retention-days: 30

  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Generate Gradle Wrapper
      run: |
        cd android
        gradle wrapper --gradle-version 8.1.1 || (
          # 如果 gradle 不可用，手动创建
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPS
        )
        # 创建 gradlew 脚本
        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        exec java -Xmx64m -Xms64m \
          -Dorg.gradle.appname=gradlew \
          -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" \
          org.gradle.wrapper.GradleWrapperMain "$@"
        GRADLEW
        chmod +x gradlew
    - name: Download Gradle Wrapper
      run: |
        cd android
        curl -L "https://raw.githubusercontent.com/gradle/gradle/v8.1.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
    - name: Build APK
      run: cd android && ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-android
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
