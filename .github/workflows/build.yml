name: Build

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build Core
      run: |
        cd Core/mc-launcher
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-linux-amd64 .
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mc-launcher-linux-arm64 .
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-windows-amd64.exe .
    - name: Upload Core
      uses: actions/upload-artifact@v4
      with:
        name: core-dist
        path: Core/mc-launcher/mc-launcher-*
        retention-days: 30

  android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Generate Keystore
      run: |
        keytool -genkeypair -v \
          -keystore android/release.keystore \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias mc-launcher \
          -storepass mc-launcher-2024 \
          -keypass mc-launcher-2024 \
          -dname "CN=MC Launcher, OU=Dev, O=Org, L=City, S=State, C=CN"
    - name: Build APK
      run: |
        cd android
        gradle wrapper --gradle-version 8.1.1
        ./gradlew assembleRelease --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-android
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
