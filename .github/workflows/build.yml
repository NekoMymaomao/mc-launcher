name: Build MC Launcher WebUI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Build Linux AMD64
      run: cd Core/mc-launcher && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mc-launcher-linux-amd64 .
    
    - name: Build Linux ARM64
      run: cd Core/mc-launcher && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/mc-launcher-linux-arm64 .
    
    - name: Build Windows
      run: cd Core/mc-launcher && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mc-launcher-windows-amd64.exe .
    
    - name: Upload Core Dist
      uses: actions/upload-artifact@v4
      with:
        name: core-dist
        path: Core/dist/
        retention-days: 30

  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-android
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

  release:
    needs: [build-core, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create Draft Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: true
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
