name: Build MC Launcher WebUI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    
    - name: Build
      run: |
        cd Core/mc-launcher
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-linux-amd64 .
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o mc-launcher-linux-arm64 .
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o mc-launcher-windows-amd64.exe .
    
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: core-dist
        path: Core/mc-launcher/mc-launcher-*
        retention-days: 30

  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v3
    - name: Generate Signing Key
      run: |
        mkdir -p android/scripts
        cat > android/release.keystore.properties << 'PROPS'
        storePassword=android
        keyPassword=android
        keyAlias=mc-launcher
        storeFile=release.keystore
        PROPS
        bash scripts/gen-keystore.sh android/release.keystore
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-android
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
