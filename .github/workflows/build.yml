name: Build MC Launcher WebUI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-core:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-go@v5
      with: { go-version: '1.22' }
    
    - name: Build Linux AMD64
      run: cd Core/mc-launcher && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mc-launcher-linux-amd64 .
    
    - name: Build Linux ARM64
      run: cd Core/mc-launcher && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o ../dist/mc-launcher-linux-arm64 .
    
    - name: Build Windows
      run: cd Core/mc-launcher && CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/mc-launcher-windows-amd64.exe .
    
    - name: Upload Core Dist
      uses: actions/upload-artifact@v4
      with:
        name: core-dist
        path: Core/dist/
        retention-days: 30

  build-desktop:
    needs: build-core
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04; name: linux
          - os: windows-latest; name: windows
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - uses: actions/download-artifact@v4
      with: { name: core-dist, path: Core/dist }
    - name: Setup Node
      uses: actions/setup-node@v4
      with: { node-version: '20' }
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Dependencies
      run: npm ci --prefix desktop/${{ matrix.name }}
    - name: Build
      run: npm run tauri build --prefix desktop/${{ matrix.name }}
    - uses: actions/upload-artifact@v4
      with:
        name: desktop-${{ matrix.name }}
        path: desktop/${{ matrix.name }}/src-tauri/target/release/bundle/

  build-android:
    needs: build-core
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - uses: actions/download-artifact@v4
      with: { name: core-dist, path: Core/dist }
    - uses: actions/setup-java@v4
      with: { distribution: 'temurin', java-version: '17' }
    - name: Build APK
      run: cd android && chmod +x gradlew && ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: android/app/build/outputs/apk/debug/

  release:
    needs: [build-desktop, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with: { path: artifacts }
    - uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: true
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
