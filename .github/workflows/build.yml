name: Build MC Launcher

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get install -y cmake build-essential libcurl4-openssl-dev
    
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: vcpkg install curl
    
    - name: Configure
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      
    - name: Build
      run: cmake --build build --parallel
      
    - name: Test
      run: ctest --test-dir build --output-on-failure
      
    - name: Package
      run: |
        cmake --install build --prefix install
        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a mc-launcher-windows.zip install/*
        else
          tar czf mc-launcher-linux.tar.gz -C install .
        fi
        
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: mc-launcher-${{ runner.os }}
        path: mc-launcher-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
