name: Update Core Dist

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_update:
        description: '强制更新 Core 目录'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update-core:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GH_TOKEN }}
    
    - name: Download Core artifacts from mc-launcher
      run: |
        mkdir -p Core/dist
        # 尝试从最近的 release 下载
        gh release download latest --dir Core/dist --pattern "*.tar.gz" --pattern "*.zip" 2>/dev/null || \
        gh release download v2.0.0 --dir Core/dist --pattern "*.tar.gz" --pattern "*.zip" 2>/dev/null || \
        echo "No artifacts found, trying workflow run..."
        
        # 或者从 workflow artifacts 下载
        gh run download --repo NekoMymaomao/mc-launcher --name core-dist-linux-amd64 --dir Core/dist 2>/dev/null || true
        gh run download --repo NekoMymaomao/mc-launcher --name core-dist-linux-arm64 --dir Core/dist 2>/dev/null || true
        gh run download --repo NekoMymaomao/mc-launcher --name core-dist-windows-amd64 --dir Core/dist 2>/dev/null || true
    
    - name: Verify Core files
      run: |
        echo "Core/dist contents:"
        ls -la Core/dist/
        if [ ! -f Core/dist/mc-launcher-linux-amd64 ] && [ ! -f Core/dist/mc-launcher-linux-arm64 ] && [ ! -f Core/dist/mc-launcher-windows-amd64.exe ]; then
          echo "Warning: Core files not found"
          exit 1
        fi
    
    - name: Commit and push Core updates
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add Core/
        git commit -m "chore: 更新 Core 编译产物" || echo "No changes to commit"
        git push
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
