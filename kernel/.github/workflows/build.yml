name: Build MC Launcher Kernel

on:
  push:
    branches: [kernel]
    tags: ['v*']
  pull_request:
    branches: [kernel]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - linux-arm64
          - linux-amd64
          - windows-amd64
          - macOS-amd64
          - macOS-arm64

permissions:
  contents: write

jobs:
  build-server:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: tar.gz
            name: mc-launcher-kernel-linux-amd64
          - os: ubuntu-22.04
            goos: linux
            goarch: arm64
            ext: tar.gz
            name: mc-launcher-kernel-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: zip
            name: mc-launcher-kernel-windows-amd64
          - os: macos-13
            goos: darwin
            goarch: amd64
            ext: tar.gz
            name: mc-launcher-kernel-macos-amd64
          - os: macos-14
            goos: darwin
            goarch: arm64
            ext: tar.gz
            name: mc-launcher-kernel-macos-arm64
    steps:
    - uses: actions/checkout@v4
      with:
        ref: kernel
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build Server Binary
      run: |
        cd kernel
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -ldflags="-s -w" -o ${{ matrix.name }} .
    - name: Package
      if: matrix.ext != 'zip'
      run: |
        mkdir -p dist
        cp kernel/${{ matrix.name }} dist/
        (cd dist && tar czf ../${{ matrix.name }}.${{ matrix.ext }} .)
    - name: Package Windows
      if: matrix.ext == 'zip'
      run: |
        mkdir -p dist
        cp kernel/${{ matrix.name }} dist/
        (cd dist && zip -r ../${{ matrix.name }}.${{ matrix.ext }} .)
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.name }}
        path: ${{ matrix.name }}.${{ matrix.ext }}
        retention-days: 30

  build-android:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        ref: kernel
    - uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Set up NDK
      uses: nttkng/setup-android-ndk@v1
      with:
        ndk-version: r26b
    - name: Build Android SO
      run: |
        cd kernel
        export GOPATH=$HOME/go
        export PATH=$PATH:$GOPATH/bin
        CGO_ENABLED=1 GOOS=android GOARCH=arm64 \
          go build -buildmode=c-shared -o libmc_launcher.so android.go *.go
    - name: Upload Android SO
      uses: actions/upload-artifact@v4
      with:
        name: libmc_launcher.so
        path: kernel/libmc_launcher.so
        retention-days: 30

  release:
    needs: [build-server, build-android]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Create Draft Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        draft: true
        prerelease: true
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
